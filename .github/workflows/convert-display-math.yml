name: Convert display math to GitHub math fences

on:
  push:
    branches: [fix/github-math-fences]
    paths:
      - '.github/workflows/convert-display-math.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-math-fences
          fetch-depth: 0

      - name: Convert all standalone dollar math blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          converted_blocks = 0
          changed_files = []

          for path in sorted(Path('.').rglob('*.md')):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              out = []
              in_code_fence = False
              math_open = False
              changed = False

              for line in lines:
                  stripped = line.strip()

                  if math_open:
                      if stripped == '$$':
                          out.append('```\n')
                          math_open = False
                          converted_blocks += 1
                          changed = True
                      else:
                          out.append(line)
                      continue

                  if in_code_fence:
                      out.append(line)
                      if stripped.startswith('```'):
                          in_code_fence = False
                      continue

                  if stripped.startswith('```'):
                      in_code_fence = True
                      out.append(line)
                      continue

                  if stripped == '$$':
                      out.append('```math\n')
                      math_open = True
                      changed = True
                      continue

                  out.append(line)

              if math_open:
                  raise SystemExit(f'unclosed display math in {path}')

              new_text = ''.join(out)
              if changed and new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed_files.append(path.as_posix())

          if converted_blocks == 0:
              raise SystemExit('no display-math blocks were converted')

          print(f'converted display-math blocks: {converted_blocks}')
          print(f'changed markdown files: {len(changed_files)}')
          for item in changed_files:
              print(item)
          PY

      - name: Verify no standalone dollar math delimiters remain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bad = []
          math_fences = 0
          for path in sorted(Path('.').rglob('*.md')):
              if '.git' in path.parts:
                  continue
              in_code = False
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  stripped = line.strip()
                  if stripped.startswith('```'):
                      if stripped == '```math':
                          math_fences += 1
                      in_code = not in_code
                      continue
                  if not in_code and stripped == '$$':
                      bad.append(f'{path}:{lineno}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit(f'standalone $$ delimiters remain: {len(bad)}')
          if math_fences == 0:
              raise SystemExit('no math fences found after conversion')
          print(f'GitHub fenced-math contract: PASS ({math_fences} math blocks)')
          PY

      - name: Regenerate source manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          excluded_parts = {'.git', '__pycache__', '.venv', 'build', 'dist'}
          excluded_suffixes = {'.pyc', '.pyo'}
          excluded_paths = {
              Path('SOURCE_MANIFEST.json'),
              Path('.github/workflows/convert-display-math.yml'),
          }
          entries = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if rel in excluded_paths:
                  continue
              if any(part in excluded_parts or part.endswith('.egg-info') for part in rel.parts):
                  continue
              if path.suffix in excluded_suffixes:
                  continue
              data = path.read_bytes()
              entries.append({
                  'path': rel.as_posix(),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              })
          manifest = {
              'classification': 'release_source_manifest',
              'files': entries,
              'project': 'Lexa AsymCompute',
              'schema_version': '1.0',
              'version': '2.0.0',
          }
          Path('SOURCE_MANIFEST.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f'manifest entries: {len(entries)}')
          PY

      - name: Test release
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python scripts/generate_reference_data.py
          python scripts/validate_release.py
          lexa-asymcompute --version

      - name: Commit converted Markdown
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.md' '**/*.md' SOURCE_MANIFEST.json || true
          git add -u
          git reset .github/workflows/convert-display-math.yml
          git commit -m 'docs: use GitHub fenced math blocks' || true
          git push origin HEAD:fix/github-math-fences
